<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eat What?!</title>
<meta name="theme-color" content="#5B2A4E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Eat What?!">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="app-icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@600;700&family=Gabarito:wght@400;600;700;800;900&family=Lilita+One&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="features.css">
<link rel="stylesheet" href="place-details.css">
<link rel="stylesheet" href="doodles.css">
<link rel="stylesheet" href="header-effects.css">
<link rel="stylesheet" href="filter-live.css">
<link rel="stylesheet" href="tutorial.css">
<link rel="stylesheet" href="typography.css">
<link rel="stylesheet" href="header-layout.css">
<link rel="stylesheet" href="wheel-interaction.css">
<link rel="stylesheet" href="app-shell.css">
</head>
<body>
<div class="app-cover" id="appCover" hidden aria-hidden="true">
  <div class="app-cover-card">
    <img class="app-cover-icon" src="app-icon.svg" alt="">
    <div class="app-cover-name">Eat What?!</div>
    <div class="app-cover-sub">Today eat what?</div>
  </div>
</div>
<script src="app-shell.js"></script>

<div class="app">

  <div class="top">
    <button class="mark" id="brandName" data-brand="eat" type="button" aria-label="Change the Eat What name" aria-live="polite" title="Tap me">Eat What?!</button>
  </div>

  <nav class="nav" id="nav">
    <button data-go="0" aria-label="Narrow it down"></button>
    <button data-go="1" aria-label="Ask the room"></button>
    <button data-go="2" aria-label="Let fate decide"></button>
  </nav>

  <section id="s0" class="hide">
    <h1 class="head title-motion title-narrow">
      <span class="title-copy">Narrow <em>it down</em></span>
      <svg class="title-doodle title-underline" viewBox="0 0 110 16" aria-hidden="true"><path d="M4 10c18-5 31 4 48 0s31 3 54-2"/></svg>
    </h1>
    <div id="today0"></div>
    <div class="panel" id="fAreaPanel"><div class="lbl">Where are we eating?</div><div class="chips" id="fArea"></div></div>
    <div class="panel"><div class="lbl">Building</div><div class="chips" id="fLoc"></div></div>
    <div class="panel"><div class="lbl">Budget</div><div class="chips" id="fPrice"></div></div>
    <div class="panel"><div class="lbl">Cuisine</div><div class="chips" id="fCui"></div></div>
    <div class="panel"><div class="lbl">Rules</div><div class="chips" id="fExtra"></div></div>
    <div id="filterPreview0" class="filter-preview" aria-live="polite"></div>

    <div class="steps">
      <button class="step" disabled>Back</button>
      <button class="step fwd" data-next="1">Ask the room</button>
    </div>
  </section>

  <section id="s1">
    <h1 class="head title-motion title-room">
      <span class="title-copy">Ask <em>the room</em></span>
      <svg class="title-doodle title-spark" viewBox="0 0 26 26" aria-hidden="true"><path class="spark-a" d="M8 2c.4 3.7 1.8 5.1 5.5 5.7C9.8 8.4 8.4 9.8 8 13.5 7.5 9.8 6.2 8.4 2.5 7.7 6.2 7.1 7.5 5.7 8 2Z"/><path class="spark-b" d="M19 13c.2 2.1 1 2.9 3.1 3.3-2.1.4-2.9 1.2-3.1 3.3-.3-2.1-1-2.9-3.1-3.3 2.1-.4 2.8-1.2 3.1-3.3Z"/></svg>
    </h1>
    <div id="filterContext1" class="filter-context"></div>
    <div id="today1"></div>
    <div id="rPick"></div>
    <div id="rRun" class="hide" style="margin-top:10px"></div>
    <div class="steps">
      <button class="step" data-next="0">Back</button>
      <button class="step fwd" data-next="2">Let fate decide</button>
    </div>
  </section>

  <section id="s2" class="hide">
    <h1 class="head title-motion title-fate">
      <span class="title-copy">Let <span class="fate-word">fate</span> <em>decide</em></span>
      <svg class="title-doodle title-swoop" viewBox="0 0 105 18" aria-hidden="true"><path d="M4 7c24 8 60 8 97-1"/><path class="swoop-tip" d="m93 2 9 4-7 6"/></svg>
    </h1>
    <div id="filterContext2" class="filter-context"></div>
    <div id="mPick"></div>
    <div id="mRun" class="hide" style="margin-top:10px"></div>
    <div class="steps">
      <button class="step" data-next="1">Back</button>
      <button class="step fwd" disabled>Pick a game</button>
    </div>
  </section>

  <section id="sv" class="hide"></section>
</div>

<section class="history-page hide" id="historyScrim" role="dialog" aria-modal="true" aria-labelledby="historyTitle">
  <div class="history-shell">
    <div class="history-head">
      <h2 id="historyTitle">History</h2>
      <div class="history-actions">
        <div class="history-menu-wrap">
          <button class="history-menu" id="historyMenu" type="button" aria-label="History options" aria-expanded="false">•••</button>
          <div class="history-menu-panel hide" id="historyMenuPanel">
            <button id="historyClear" type="button">Clear all history</button>
          </div>
        </div>
        <button class="history-close" id="historyClose" type="button" aria-label="Close history">×</button>
      </div>
    </div>
    <div class="history-empty hide" id="historyEmpty">
      <svg class="history-empty-art" viewBox="0 0 64 48" aria-hidden="true">
        <path class="steam-line steam-one" d="M24 14c-5-5 4-7 0-12"/>
        <path class="steam-line steam-two" d="M38 14c5-5-4-7 0-12"/>
        <path class="accent" d="M9 25c4-5 13-8 23-8s19 3 23 8l-5 12c-4 6-12 9-18 9s-14-3-18-9L9 25Z"/>
        <path class="bowl-line" d="M11 25c8 4 34 4 42 0M18 38c8 3 20 3 28 0"/>
      </svg>
      <div class="history-empty-copy">Nothing here yet.</div>
    </div>
    <div id="logList" class="history-list"></div>
  </div>
</section>

<section class="history-page hide" id="manageScrim" role="dialog" aria-modal="true" aria-labelledby="manageTitle">
  <div class="history-shell manage-shell">
    <div class="history-head">
      <div>
        <div class="lbl">Clean up data</div>
        <h2 id="manageTitle">Manage places</h2>
      </div>
      <button class="history-close" id="manageClose" type="button" aria-label="Close manage places">×</button>
    </div>
    <p class="manage-note">Delete places you no longer want in recommendations. Deletions stay removed on this browser.</p>
    <div class="field manage-search"><label for="manageSearch">Search</label><input id="manageSearch" type="search" placeholder="Search name, building or address" autocomplete="off"></div>
    <div class="chips manage-areas" id="manageAreas"></div>
    <div id="manageList" class="manage-list"></div>
  </div>
</section>

<div class="quick-actions" id="quickActions" aria-hidden="true">
  <button class="quick-action quick-manage" type="button" data-quick="manage" aria-label="Manage places">
    <span class="quick-icon">−</span><span>Manage places</span>
  </button>
  <button class="quick-action quick-history" type="button" data-quick="history" aria-label="Open history">
    <span class="quick-icon">↺</span><span>History</span>
  </button>
  <button class="quick-action quick-add" type="button" data-quick="add" aria-label="Add a place">
    <span class="quick-icon">＋</span><span>Add place</span>
  </button>
</div>

<button class="fab" id="quickFab" type="button" aria-label="Open quick actions" aria-expanded="false">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<script src="data.js"></script>
<script src="data-chinatown.js"></script>
<script src="data-peoples-park.js"></script>
<script src="data-cbd-expansion.js"></script>
<script src="data-cleanup.js"></script>
<script src="core.js"></script>
<script src="filters.js"></script>
<script src="add-place.js"></script>
<script src="filter-live.js"></script>
<script src="manage-places.js"></script>
<script src="rituals.js"></script>
<script src="games.js"></script>
<script src="wheel-interaction.js"></script>
<script src="verdict-nav.js"></script>
<script src="winner-effects.js"></script>
<script src="header-effects.js"></script>
<script src="nav-init.js"></script>
<script src="tutorial.js"></script>
</body>
</html>
