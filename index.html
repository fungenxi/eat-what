<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eat What?!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gabarito:wght@400;600;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="mobile.css">
</head>
<body>
<div class="app">

  <div class="top">
    <button class="mark" id="brandName" type="button" aria-label="Change the Eat What name" aria-live="polite" title="Tap me">Eat What?!</button>
    <div class="meta"><b id="clock"></b></div>
  </div>

  <nav class="nav" id="nav">
    <button data-go="0" aria-label="Narrow it down"></button>
    <button data-go="1" aria-label="Ask the room"></button>
    <button data-go="2" aria-label="Let fate decide"></button>
  </nav>

  <section id="s0" class="hide">
    <h1 class="head">Narrow <em>it down</em></h1>
    <div id="today0"></div>
    <div class="panel hide" id="fAreaPanel"><div class="lbl">Area</div><div class="chips" id="fArea"></div></div>
    <div class="panel"><div class="lbl">Building</div><div class="chips" id="fLoc"></div></div>
    <div class="panel"><div class="lbl">Budget</div><div class="chips" id="fPrice"></div></div>
    <div class="panel"><div class="lbl">Cuisine</div><div class="chips" id="fCui"></div></div>
    <div class="panel"><div class="lbl">Rules</div><div class="chips" id="fExtra"></div></div>

    <div class="steps">
      <button class="step" disabled>Back</button>
      <button class="step fwd" data-next="1">Ask the room</button>
    </div>
  </section>

  <section id="s1">
    <h1 class="head">Ask <em>the room</em></h1>
    <div id="today1"></div>
    <div id="rPick"></div>
    <div id="rRun" class="hide" style="margin-top:10px"></div>
    <div class="steps">
      <button class="step" data-next="0">Back</button>
      <button class="step fwd" data-next="2">Let fate decide</button>
    </div>
  </section>

  <section id="s2" class="hide">
    <h1 class="head">Let fate <em>decide</em></h1>
    <div id="mPick"></div>
    <div id="mRun" class="hide" style="margin-top:10px"></div>
    <div class="steps">
      <button class="step" data-next="1">Back</button>
      <button class="step fwd" disabled>Pick a game</button>
    </div>
  </section>

  <section id="sv" class="hide"></section>

  <section id="logBox" class="hide" style="margin-top:10px">
    <div class="panel"><div class="lbl">Eaten recently</div><div id="logList"></div></div>
  </section>

</div>

<button class="fab" id="openAdd" type="button" aria-label="Add a place">
  <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
</button>

<script src="data.js"></script>
<script src="data-cleanup.js"></script>
<script src="core.js"></script>
<script src="filters.js"></script>
<script src="add-place.js"></script>
<script src="rituals.js"></script>
<script src="games.js"></script>
<script src="verdict-nav.js"></script>
<script src="nav-init.js"></script>
</body>
</html>
